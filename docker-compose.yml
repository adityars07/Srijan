version: '3.8'

services:
  # 0. PostgreSQL Database (replaces SQLite files)
  postgres:
    image: postgres:16-alpine
    container_name: srijan-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=srijan
      - POSTGRES_PASSWORD=srijan_dev_2026
      - POSTGRES_DB=srijan_main
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init script to create separate databases for each service
      - ./server/scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srijan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 0b. Redis In-Memory Cache & Ephemeral Store
  redis:
    image: redis:7-alpine
    container_name: srijan-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 1. Authentication Service
  auth-service:
    build:
      context: ./server/services/auth-service
      dockerfile: Dockerfile
    container_name: srijan-auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://srijan:srijan_dev_2026@postgres:5432/srijan_auth?schema=public
      - JWT_SECRET=srijan_artisan_secret_key_2026_super_secure_jwt
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 2. Product & Review Service
  product-service:
    build:
      context: ./server/services/product-service
      dockerfile: Dockerfile
    container_name: srijan-product-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://srijan:srijan_dev_2026@postgres:5432/srijan_products?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 3. Order & Coupon Service
  order-service:
    build:
      context: ./server/services/order-service
      dockerfile: Dockerfile
    container_name: srijan-order-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - DATABASE_URL=postgresql://srijan:srijan_dev_2026@postgres:5432/srijan_orders?schema=public
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - JWT_SECRET=srijan_artisan_secret_key_2026_super_secure_jwt
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

  # 4. Commission & Contact Service
  commission-service:
    build:
      context: ./server/services/commission-service
      dockerfile: Dockerfile
    container_name: srijan-commission-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - DATABASE_URL=postgresql://srijan:srijan_dev_2026@postgres:5432/srijan_commissions?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  # 5. API Gateway
  api-gateway:
    build:
      context: ./server/gateway
      dockerfile: Dockerfile
    container_name: srijan-api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - ORDER_SERVICE_URL=http://order-service:5003
      - COMMISSION_SERVICE_URL=http://commission-service:5004
    depends_on:
      - auth-service
      - product-service
      - order-service
      - commission-service

volumes:
  postgres-data:
  redis-data:
